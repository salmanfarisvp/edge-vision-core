name: edge-vision-core
base: core24
version: '0.1'
summary: Edge Impulse live camera demo for Ubuntu Core
description: |
  Runs an Edge Impulse .eim model on frames from a USB camera and serves a
  live view with the results on port 8000. Pair it with Ubuntu Frame and
  wpe-webkit-mir-kiosk to show it full screen on a display attached to the Pi.

  Options (snap set edge-vision-core ...):
    port       HTTP port (default 8000)
    camera     V4L2 camera index, /dev/videoN (default 0)
    threshold  minimum confidence to show a result (default 0.6)
    model-url  optional URL to download model.eim from
grade: devel
confinement: strict
platforms:
  arm64:

components:
  model:
    type: standard
    summary: YOLOv5 COCO object detection model (Edge Impulse .eim)
    description: |
      YOLOv5 pretrained on COCO's 80 classes, 320x320 int8, built with Edge
      Impulse for Linux AARCH64. Used when no model.eim is in $SNAP_COMMON.
    version: '12'

apps:
  server:
    command: bin/python3 $SNAP/app/edge_vision.py
    daemon: simple
    restart-condition: always
    restart-delay: 3s
    environment:
      OPENCV_LOG_LEVEL: ERROR   # stop OpenCV repeating warnings while no camera is attached
    plugs: [camera, network, network-bind]

parts:
  deps:
    plugin: python
    source: .
    python-requirements: [requirements.txt]
    stage-packages: [python3-venv]
    build-environment:
      - PIP_DEFAULT_TIMEOUT: "120"   # tolerate slow connections to PyPI
      - PIP_RETRIES: "10"

  app:
    plugin: dump
    source: src/
    override-prime: |
      craftctl default
      chmod 755 app/edge_vision.py

  # The default model lives in its own component, so it can be rebuilt and
  # installed separately from the app.
  model:
    plugin: dump
    source: models/
    organize:
      yolov5-coco-320-int8-linux-aarch64.eim: (component/model)/default.eim
      README.md: (component/model)/README.md
    override-prime: |
      craftctl default
      chmod 755 "$CRAFT_COMPONENT_MODEL_PRIME/default.eim"
