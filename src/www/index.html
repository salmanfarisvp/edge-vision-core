<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Impulse on Ubuntu Core</title>
<style>
  :root { --bg:#0b0d10; --fg:#f2f4f7; --muted:#8a94a3; --accent:#3cdc78; --warn:#f5b73b; --err:#ff6b6b; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg);
    font-family: Ubuntu, "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  body.kiosk { cursor:none; }
  main { display:grid; grid-template-columns: 1fr minmax(260px, 28vw); height:100%; }
  .video { position:relative; display:flex; align-items:center; justify-content:center; background:#000; }
  .video canvas { width:100%; height:100%; object-fit:contain; }
  .msg { position:absolute; inset:auto 5% 5% 5%; padding:14px 18px; border-radius:10px;
    background:rgba(0,0,0,.7); font-size:clamp(14px,1.6vw,22px); display:none; }
  .msg.warn { display:block; border-left:4px solid var(--warn); }
  .msg.error { display:block; border-left:4px solid var(--err); }
  aside { padding:clamp(16px,2.5vw,40px); display:flex; flex-direction:column; gap:clamp(14px,2vh,28px);
    border-left:1px solid #1d2229; }
  .eyebrow { color:var(--muted); font-size:clamp(11px,1vw,15px); text-transform:uppercase; letter-spacing:.08em; }
  .top-label { font-size:clamp(32px,5vw,84px); font-weight:700; line-height:1.05; word-break:break-word; }
  .top-label.none { color:var(--muted); font-weight:400; }
  .conf { font-size:clamp(18px,2vw,32px); color:var(--accent); font-variant-numeric:tabular-nums; }
  .bars { display:flex; flex-direction:column; gap:10px; }
  .bar { display:grid; grid-template-columns: 1fr auto; gap:4px 10px; font-size:clamp(13px,1.2vw,18px); }
  .bar .track { grid-column:1 / -1; height:8px; background:#1d2229; border-radius:4px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--accent); transition:width .2s; }
  .bar .v { font-variant-numeric:tabular-nums; color:var(--muted); }
  .stats { margin-top:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat b { display:block; font-size:clamp(18px,2vw,30px); font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:clamp(11px,.9vw,14px); }
  .model { color:var(--muted); font-size:clamp(11px,.9vw,14px); word-break:break-word; }
  @media (max-width: 700px) {
    main { grid-template-columns:1fr; grid-template-rows: 55vh 1fr; }
    aside { border-left:0; border-top:1px solid #1d2229; }
  }
</style>
</head>
<body>
<main>
  <div class="video">
    <canvas id="video" width="640" height="480" aria-label="Live camera"></canvas>
    <div class="msg" id="msg"></div>
  </div>
  <aside>
    <div>
      <div class="eyebrow">Detected</div>
      <div class="top-label none" id="top">Waiting...</div>
      <div class="conf" id="conf"></div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="stats">
      <div class="stat"><b id="fps">-</b><span>FPS</span></div>
      <div class="stat"><b id="lat">-</b><span>ms / frame</span></div>
      <div class="stat"><b id="thr">-</b><span>threshold</span></div>
    </div>
    <div class="model" id="model">Edge Impulse on Ubuntu Core</div>
  </aside>
</main>
<script>
  if (new URLSearchParams(location.search).has("kiosk")) document.body.classList.add("kiosk");
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  async function tick() {
    try {
      const s = await (await fetch("/api/status", {cache: "no-store"})).json();
      const msg = $("msg");
      msg.className = "msg" + (s.state === "warn" ? " warn" : s.state === "error" ? " error" : "");
      msg.textContent = s.message || "";

      if (s.top) {
        $("top").textContent = s.top.label; $("top").className = "top-label";
        $("conf").textContent = (s.top.value * 100).toFixed(0) + "%";
      } else {
        $("top").textContent = s.model ? "Nothing above threshold" : "No model";
        $("top").className = "top-label none"; $("conf").textContent = "";
      }

      let rows = Object.entries(s.classes || {});
      if (!rows.length && s.boxes) rows = s.boxes.map(b => [b.label, b.value]);
      rows.sort((a, b) => b[1] - a[1]);
      $("bars").innerHTML = rows.slice(0, 5).map(([k, v]) =>
        `<div class="bar"><span>${esc(k)}</span><span class="v">${(v*100).toFixed(0)}%</span>
         <div class="track"><div class="fill" style="width:${(v*100).toFixed(1)}%"></div></div></div>`).join("");

      $("fps").textContent = s.fps ?? "-";
      $("lat").textContent = s.latency_ms ?? "-";
      $("thr").textContent = s.threshold ?? "-";
      $("model").textContent = s.model ? `${s.model} · ${s.kind}` : "Edge Impulse on Ubuntu Core";
    } catch (e) {
      $("msg").className = "msg error"; $("msg").textContent = "Lost connection to the Pi...";
    }
  }
  setInterval(tick, 300); tick();

  // Video: fetch one JPEG at a time, decode it off-screen, then draw it.
  // The canvas always holds the last complete frame, so nothing blanks
  // between frames (an MJPEG <img> flickers in WebKit, which the kiosk uses).
  const canvas = $("video"), ctx = canvas.getContext("2d");
  let seq = -1;
  async function nextFrame() {
    try {
      const r = await fetch("/frame.jpg?after=" + seq, {cache: "no-store"});
      if (!r.ok) throw new Error(r.status);
      seq = r.headers.get("X-Frame-Seq") ?? seq;
      const url = URL.createObjectURL(await r.blob());
      const img = new Image();
      await new Promise((ok, fail) => { img.onload = ok; img.onerror = fail; img.src = url; });
      if (canvas.width !== img.naturalWidth) canvas.width = img.naturalWidth;
      if (canvas.height !== img.naturalHeight) canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      requestAnimationFrame(nextFrame);
    } catch (e) {
      setTimeout(nextFrame, 1000);  // Pi restarting or no camera yet; keep the last frame
    }
  }
  nextFrame();
</script>
</body>
</html>
